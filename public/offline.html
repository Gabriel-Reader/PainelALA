<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sem conexão — Painel da Ala</title>
    <meta name="theme-color" content="#0c4a6e" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        background: #171717;
        color: #e5e5e5;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .card {
        background: #262626;
        border: 1px solid #404040;
        border-radius: 1.25rem;
        padding: 2.5rem;
        max-width: 360px;
        width: 100%;
        text-align: center;
      }
      .icon {
        font-size: 3.5rem;
        margin-bottom: 1.25rem;
      }
      h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.5rem; color: #f5f5f5; }
      p  { font-size: 0.9rem; color: #a3a3a3; line-height: 1.6; margin-bottom: 1.5rem; }
      button {
        background: #0369a1;
        color: #fff;
        border: none;
        border-radius: 0.6rem;
        padding: 0.65rem 1.5rem;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      button:hover { background: #0284c7; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📡</div>
      <h1>Você está offline</h1>
      <p>Não foi possível carregar o Painel da Ala. Verifique sua conexão com a internet e tente novamente.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
